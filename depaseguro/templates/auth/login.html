{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<section class="seccion">
  <div class="contenedor" style="max-width:440px">
    <form class="caja" method="post">
      <h1>Ingresar</h1>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Correo <input type="email" name="email" required autocomplete="username"></label>
      <label>Contraseña <input type="password" name="password" required autocomplete="current-password"></label>
      <button class="boton" type="submit">Ingresar</button>
      <p class="nota">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Créala aquí</a>.</p>
    </form>
  </div>
</section>
{% endblock %}
